[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# Close to Home Assistant core's selection, limited to rules that fit a
# custom integration
select = [
    "ARG", # flake8-unused-arguments
    "B", # flake8-bugbear
    "BLE", # flake8-blind-except
    "C4", # flake8-comprehensions
    "D", # pydocstyle
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "PIE", # flake8-pie
    "PL", # pylint
    "RET", # flake8-return
    "RUF", # ruff specific rules
    "SIM", # flake8-simplify
    "TRY", # tryceratops
    "UP", # pyupgrade
    "W", # pycodestyle warnings
]
# The same rules Home Assistant core ignores
ignore = [
    "D202", # No blank lines allowed after function docstring
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "D406", # Section name should end with a newline
    "D407", # Section name underlining
    "E501", # line too long
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "TRY003", # Avoid specifying long messages outside the exception class
    "TRY400", # Use logging.exception: the error text is enough, no traceback
]

[tool.ruff.lint.per-file-ignores]
# Tests take their fixtures as positional arguments
"tests/*" = ["PLR0917"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components", "tests"]
forced-separate = ["tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
addopts = "-p syrupy --strict-markers --cov=custom_components"

[tool.coverage.run]
source = ["custom_components"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplemented()",
    "if __name__ == '__main__':",
    '^\s*main\(\)$',
]
show_missing = true

[tool.mypy]
python_version = "3.14"
# custom_components has no __init__.py: map files to modules from the repo
# root, or mypy sees const.py as both hetzner.const and
# custom_components.hetzner.const and aborts
explicit_package_bases = true
follow_imports = "silent"
strict = true
warn_incomplete_stub = true

[[tool.mypy.overrides]]
module = "tests.*"
# Asserting the entry state after a reload or unload: mypy keeps the state
# narrowed by the assert before it and reports a non-overlapping comparison
disable_error_code = ["comparison-overlap"]
