name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.test.txt
            setup.cfg
      - name: Install python packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.test.txt
      - name: Run pytest
        run: pytest
  black:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.test.txt
            setup.cfg
      - name: Install python packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.test.txt
      - name: Run black
        run: black custom_components/ --check
  isort:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.test.txt
            setup.cfg
      - name: Install python packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.test.txt
      - name: Run isort
        run: isort custom_components/ -c
  flake8:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.test.txt
            setup.cfg
      - name: Install python packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.test.txt
      - name: Run isort
        run: flake8 custom_components/
  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.test.txt
            setup.cfg
      - name: Install python packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.test.txt
      - name: Run isort
        run: mypy custom_components/
