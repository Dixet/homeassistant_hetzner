name: Codestyle and Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.test.txt
            pyproject.toml
      - name: Install python packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.test.txt
      - name: Run pytest
        run: pytest
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.test.txt
            pyproject.toml
      - name: Install python packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.test.txt
      - name: Run ruff check
        run: ruff check --output-format=github .
      - name: Run ruff format
        run: ruff format --check .
  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.test.txt
            pyproject.toml
      - name: Install python packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.test.txt
      - name: Run mypy
        run: mypy custom_components tests
